name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out SimpleDisplays
        uses: actions/checkout@v6
        with:
          repository: i-Moril/SimpleDisplays
          ref: ca37ad21ffa134462ab6a5eab646d79a552ca222
          path: .ci/SimpleDisplays

      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: WebUI/frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare SimpleDisplays API
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: >-
          ./gradlew -p .ci/SimpleDisplays publishToMavenLocal
          -Dmaven.repo.local="${RUNNER_TEMP}/simpledisplays-maven"
          --no-daemon

      - name: Build and test
        run: >-
          ./gradlew
          :Annotation:test
          :Basic:test
          :BukkitPlugin:test
          :BukkitPluginDev:test
          :ConfigLib:test
          :Decorations:check
          :Core:test
          :SimpleSignals:check
          :SimpleATO:test
          :SimpleATOBukkit:test
          :verifySignalModuleBoundaries
          :WebUI:test
          :BukkitPlugin:shadowJar
          :WebUI:shadowJar
          -PsimpleDisplaysRepository="${RUNNER_TEMP}/simpledisplays-maven"
          --no-daemon

      - name: Upload server plugins
        uses: actions/upload-artifact@v4
        with:
          name: JavaRailways-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BukkitPlugin/build/libs/*-all.jar
            SimpleSignals/build/libs/*.jar
            Decorations/build/libs/*.jar

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: "**/build/reports/tests/**"
