name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: WebUI/frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: >-
          ./gradlew
          :Annotation:test
          :Basic:test
          :BukkitPlugin:test
          :BukkitPluginDev:test
          :ConfigLib:test
          :Core:test
          :SimpleATO:test
          :SimpleATOBukkit:test
          :WebUI:test
          :BukkitPlugin:shadowJar
          :WebUI:shadowJar
          --no-daemon

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JavaRailways-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            BukkitPlugin/build/libs/*-all.jar
            WebUI/build/libs/*-all.jar

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: "**/build/reports/tests/**"
