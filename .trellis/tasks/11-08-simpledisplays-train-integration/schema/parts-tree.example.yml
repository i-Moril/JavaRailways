# Car body-parts fragment, not a complete car definition; no screen visuals yet.
# Both imports and inline definitions follow existing partReference conventions.
# Positions/dimensions are illustrative, not calibrated model-package values.
body-parts:
  - import: cabin_lcd
    offset: {x: -1.2, y: 1.6, z: 2.0}
    rotation: {y: 90}

  - config-version: 1
    name: cabin_lcd_right
    type: screen
    offset: {x: 1.2, y: 1.6, z: 2.0}
    rotation: {y: -90}
    screen:
      category: cabin_side_lcd
      interior: true
      width: 0.8
      height: 0.45

  - config-version: 1
    name: head_display_group
    type: dummy
    offset: {x: 0, y: 1.8, z: 8.5}
    parts:
      - config-version: 1
        name: head_destination
        type: screen
        screen:
          category: head_led
          interior: false
          width: 1.2
          height: 0.25
