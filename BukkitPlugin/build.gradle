plugins {
    id 'java'
    id('org.jetbrains.kotlin.jvm') version '2.3.0'
    id('org.jetbrains.kotlin.plugin.serialization') version '2.3.0'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.19"
    id("xyz.jpenilla.run-paper") version "3.0.2" // Adds runServer and runMojangMappedServer tasks for testing
    id("xyz.jpenilla.resource-factory-bukkit-convention") version "1.3.0" // Generates plugin.yml based on the Gradle config
    id 'com.gradleup.shadow' version '9.2.2'
}

evaluationDependsOn(":WebUI")

runPaper {
    disablePluginJarDetection()
}

def foliaPluginJar = layout.buildDirectory.file("folia-plugin/MineRails.jar")
def prepareFoliaPlugin = tasks.register("prepareFoliaPlugin", Copy) {
    dependsOn(tasks.shadowJar)
    from(tasks.shadowJar.archiveFile)
    into(layout.buildDirectory.dir("folia-plugin"))
    rename { "MineRails.jar" }
}

runPaper.folia.registerTask {
    minecraftVersion("26.1.2")
    runDirectory = file("run-folia")
    dependsOn(prepareFoliaPlugin)
    pluginJars.from(foliaPluginJar)
    jvmArgs("-Dcom.mojang.eula.agree=true")
}

def jomlShadow = configurations.detachedConfiguration(dependencies.create("org.joml:joml:1.10.8"))
def webUiShadowJar = project(":WebUI").tasks.named("shadowJar")

tasks.named("processResources") {
    dependsOn(webUiShadowJar)
    from(webUiShadowJar.flatMap { it.archiveFile }) {
        into("webui")
        rename { "MineRails-WebUI.jar" }
    }
}

group = 'work.art1st'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://maven.pvphub.me/tofaa") }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")
    // Packet entity backend bootstrap: keep PacketEvents and EntityLib on the same shaded runtime classpath.
    implementation("com.github.retrooper:packetevents-spigot:2.12.1")
    compileOnly("org.joml:joml:1.10.8")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
    implementation("org.graalvm.polyglot:polyglot:24.2.2")
    implementation("org.graalvm.polyglot:js-community:24.2.2")
    implementation("io.github.tofaa2:spigot:3.0.3-SNAPSHOT") // EntityLib; version pinning is tracked in the packet renderer plan.
    implementation("net.jcip:jcip-annotations:1.0")
    implementation(platform("io.insert-koin:koin-bom:4.1.1"))
    implementation("io.insert-koin:koin-core:4.1.1")
    implementation(project(":Core"))
    implementation(project(":Basic"))
    implementation(project(":ConfigLib"))
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation(testFixtures(project(":Core")))
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks {
    compileJava {
        // Set the release flag. This configures what version bytecode the compiler will emit, as well as what JDK APIs are usable.
        // See https://openjdk.java.net/jeps/247 for more information.
        options.release = 25
    }
    runServer {
        minecraftVersion("1.21.11")
        pluginJars.from(tasks.shadowJar.archiveFile)
        // Also load the Dev plugin for testing
        pluginJars.from(provider {
            rootProject.project(":BukkitPluginDev").tasks.shadowJar.archiveFile.get().asFile
        })
        dependsOn(":BukkitPluginDev:shadowJar")
        doFirst {
            delete(layout.projectDirectory.dir("run/plugins/.paper-remapped"))
        }
    }
//    reobfJar {
//        // This is an example of how you might change the output location for reobfJar. It's recommended not to do this
//        // for a variety of reasons, however it's asked frequently enough that an example of how to do it is included here.
//        outputJar = layout.buildDirectory.file("libs/PaperweightTestPlugin-${project.version}.jar")
//    }
}

//paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.REOBF_PRODUCTION

tasks.named("reobfJar") {
    // Development servers consume the Mojang-mapped shadow JAR directly. TinyRemapper 0.12
    // cannot read the Java 25 bytecode required by the current Folia target.
    onlyIf {
        !gradle.startParameter.taskNames.any { name ->
            name.endsWith("runServer") || name.endsWith("runFolia")
        }
    }
}

tasks.assemble {
    dependsOn(tasks.reobfJar)
}

shadowJar {
    from(sourceSets.main.resources)
    mergeServiceFiles()
    relocate 'org.joml.Vector3dKt', 'work.art1st.mineRails.shadow.org.joml.Vector3dKt'
    // PacketEvents is embedded: relocate both API and platform implementation to avoid server-plugin conflicts.
    relocate 'com.github.retrooper.packetevents', 'work.art1st.mineRails.shadow.packetevents.api'
    relocate 'io.github.retrooper.packetevents', 'work.art1st.mineRails.shadow.packetevents.impl'
    relocate 'me.tofaa.entitylib', 'work.art1st.mineRails.shadow.entitylib'
    configurations = [project.configurations.runtimeClasspath, jomlShadow]
    dependencies {
        // GraalJS language selector artifacts are POM-only. They bring the real
        // runtime jars transitively, but Shadow tries to unzip the POM itself.
        // Exclude only these selector POMs from the fat jar.
        exclude(dependency('org.graalvm.polyglot:js-community:.*'))
        exclude(dependency('org.graalvm.js:js-community:.*'))
    }
}

// 确保在执行 build 时触发 shadowJar
build.dependsOn shadowJar

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    // 由 resource-factory-bukkit-convention 插件生成，手动版本不再需要
    exclude 'plugin.yml'
}
kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

//paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.MOJANG_PRODUCTION

bukkitPluginYaml {
    name = "MineRails"
    main = "work.art1st.mineRails.bukkit.BukkitPlugin"
    apiVersion = "1.21.11"
    foliaSupported = true

    authors.add("__ART1st__")

    // Embedded PacketEvents must load after other protocol injectors when they are present.
    softDepend.addAll("ProtocolLib", "ProtocolSupport", "ViaVersion", "ViaBackwards", "ViaRewind", "Geyser-Spigot")

    // 须在 plugin.yml 中声明，getCommand("minerails"/"mr") 才能拿到命令实例
    commands.register("minerails") {
        description.set("MineRails 插件主命令")
        aliases.add("mr")
    }
}
