        }
        pluginJars.from(tasks.shadowJar.archiveFile)
        pluginJars.from(project(":TunnelBridgeBuilder").tasks.named("shadowJar").flatMap { it.archiveFile })
        pluginJars.from(simpleSignalsJar.flatMap { it.archiveFile })
        // Also load the Dev plugin for testing
        pluginJars.from(provider {
            rootProject.project(":BukkitPluginDev").tasks.shadowJar.archiveFile.get().asFile
        })
        dependsOn(":BukkitPluginDev:shadowJar", ":TunnelBridgeBuilder:shadowJar", simpleSignalsJar)
        doFirst {
            delete(layout.projectDirectory.dir("run/plugins/.paper-remapped"))
        }
    }
//    reobfJar {
//        // This is an example of how you might change the output location for reobfJar. It's recommended not to do this
//        // for a variety of reasons, however it's asked frequently enough that an example of how to do it is included here.
//        outputJar = layout.buildDirectory.file("libs/PaperweightTestPlugin-${project.version}.jar")
//    }
}

//paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.REOBF_PRODUCTION

tasks.named("reobfJar") {
    // Development servers consume the Mojang-mapped shadow JAR directly. TinyRemapper 0.12
    // cannot read the Java 25 bytecode required by the current Folia target.
    onlyIf {
        !gradle.startParameter.taskNames.any { name ->
            name.endsWith("runServer") || name.endsWith("runFolia")
        }
    }
}

tasks.assemble {
    dependsOn(tasks.reobfJar)
}

shadowJar {
    from(sourceSets.main.resources)
    mergeServiceFiles()
    relocate 'org.joml.Vector3dKt', 'work.art1st.javarailways.shadow.org.joml.Vector3dKt'
    relocate 'me.tofaa.entitylib', 'work.art1st.javarailways.shadow.entitylib'
    relocate 'org.incendo.cloud', 'work.art1st.javarailways.shadow.cloud'
    configurations = [project.configurations.runtimeClasspath, jomlShadow]
    dependencies {
        // Language selector artifacts are POM-only; their transitive runtime jars are included.
        exclude(dependency('org.graalvm.polyglot:js-community:.*'))
        exclude(dependency('org.graalvm.js:js-community:.*'))
    }
}

// 确保在执行 build 时触发 shadowJar
build.dependsOn shadowJar

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Coordinate regression reads the shipped packages directly; edits must invalidate test results.
tasks.named('test') {
    inputs.files(rootProject.fileTree('examples/models/rails') { include '**/rail_model.yml' })
}


kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

