evaluationDependsOn(":WebUI")
evaluationDependsOn(":TunnelBridgeBuilder")
evaluationDependsOn(":SimpleSignals")

runPaper {
    disablePluginJarDetection()
}

def foliaPluginJar = layout.buildDirectory.file("folia-plugin/JavaRailways.jar")
def simpleSignalsJar = project(":SimpleSignals").tasks.named("jar", Jar)
def prepareFoliaPlugin = tasks.register("prepareFoliaPlugin") {
    dependsOn(tasks.shadowJar)
    inputs.file(tasks.shadowJar.archiveFile)
    outputs.file(foliaPluginJar)
    doLast {
        def source = tasks.shadowJar.archiveFile.get().asFile.toPath()
        def target = foliaPluginJar.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        def staged = java.nio.file.Files.createTempFile(target.parent, "JavaRailways-", ".jar.tmp")
        try {
            java.nio.file.Files.copy(source, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            // Never truncate the jar held by a running Paper/Folia classloader. An atomic rename
            // leaves its old inode readable while the next server start observes the new jar.
            java.nio.file.Files.move(
                staged,
                target,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        } finally {
            java.nio.file.Files.deleteIfExists(staged)
        }
    }
}

runPaper.folia.registerTask {
    minecraftVersion("26.1.2")
    downloadPlugins {
        github("retrooper", "packetevents", "v2.12.1", "packetevents-spigot-2.12.1.jar")
    }
    runDirectory = file("run-folia")
    dependsOn(prepareFoliaPlugin, ":TunnelBridgeBuilder:shadowJar", simpleSignalsJar)
    pluginJars.from(foliaPluginJar)
    pluginJars.from(project(":TunnelBridgeBuilder").tasks.named("shadowJar").flatMap { it.archiveFile })
    pluginJars.from(simpleSignalsJar.flatMap { it.archiveFile })
    jvmArgs("-Dcom.mojang.eula.agree=true")
}

def jomlShadow = configurations.detachedConfiguration(dependencies.create("org.joml:joml:1.10.8"))
def webUiShadowJar = project(":WebUI").tasks.named("shadowJar")

tasks.named("processResources") {
    dependsOn(webUiShadowJar)
    from(webUiShadowJar.flatMap { it.archiveFile }) {
        into("webui")
        rename { "JavaRailways-WebUI.jar" }
    }
}

