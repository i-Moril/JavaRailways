# JavaRailways 主配置。
# 除明确说明默认值的键外，每个键都是必填项；缺失或写错类型时启动报错。

# 已保存列车在模型包更新后的跟随策略。
# follow-package: reload 按创建模板类型统一更新全部实例的模型与运行配置；失败类型保留原版本。
# snapshot: 模型与运行配置固定在创建时的快照，重启后保持；reload 只更新可创建的资源。
train-model-update-policy: follow-package

# JavaRailways 展示实体渲染后端。座椅在两种模式下都使用 packet 虚拟 ArmorStand，
# 并保留隐藏的 native ArmorStand 作为服务端权威载体。
# entitylib: 默认；轨道和列车视觉 Display 使用 EntityLib + PacketEvents。
# native: 显式回退到真实 Bukkit/Paper Display，受原生实体追踪和区块发送距离限制。
display-renderer:
  backend: entitylib
  player-distance:
    # 未单独设置时，使用玩家客户端设置的视距换算为方块。
    default: player-view-distance
    # JavaRailways 允许的最大展示半径。必须在 (0, 4096] 内。
    max-blocks: 512.0

# 玩家与绑定列车任意车厢中心的最大允许距离（米）。
# 超过该距离后，列车钥匙会自动解绑。
train-key-bind-distance: 20.0

# 是否启用逐 tick 列车调试日志。
# true 时会写入 plugins/JavaRailways/debug/train_debug.csv。
# 仅在短时间采样排障时开启。
train-debug-log: false

# 全局 ATO 安全距离（米），必须是有限非负数；缺省为 5.0。
# 时刻表路线保护、实际驾驶及隔离模拟使用同一值。修改后重启生效。
# 移动闭塞停车时为真实轨道授权保留余量，不改变运营停车目标。
ato:
  safety-distance-meters: 5.0

# 轨道工程、曲线采样、物理 Worker、超速脱轨与道岔安全参数位于 physics.yml。

# Timetable WebUI process mode:
# managed: JavaRailways extracts, starts, and stops an isolated WebUI Java sidecar (default).
# external: an administrator runs WebUI independently; both processes use bearer-token-env.
# disabled: neither WebUI nor its bridge is started.
timetable-webui:
  mode: managed
  bind-address: 127.0.0.1
  port: 8080
  # Clickable URL emitted by /jr timetable edit. Remote plaintext HTTP is allowed
  # but vulnerable to network interception; use HTTPS when that matters.
  public-url: http://127.0.0.1:8080
  shutdown-timeout-millis: 5000

# Authenticated loopback-only timetable HTTP bridge used by managed or external WebUI.
# In managed mode JavaRailways generates an ephemeral token; bearer-token-env is used only
# in external mode.
timetable-http-bridge:
  enabled: true
  bind-address: 127.0.0.1
  port: 8765
  bearer-token-env: JAVARAILWAYS_TIMETABLE_HTTP_TOKEN
  body-limit-bytes: 1048576
  timeout-millis: 5000
