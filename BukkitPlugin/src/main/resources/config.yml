# MineRails 主配置。
# 本文件中的每个键都是必填项；如果删除或写错类型，插件会在启动时报错。

# 已保存列车在模型包更新后的跟随策略。
# follow-package: 保留已保存的车厢模型名，但按当前包文件重新构建模型。
# snapshot: 保存解析后的模型快照，后续不跟随包文件变更。
train-model-update-policy: follow-package

# MineRails 展示实体渲染后端。
# entitylib: 默认；轨道和列车视觉 Display 使用 EntityLib + PacketEvents，座位、交互和碰撞仍为 native。
# native: 显式回退到真实 Bukkit/Paper Display，受原生实体追踪和区块发送距离限制。
display-renderer:
  backend: entitylib
  player-distance:
    # 未单独设置时，使用玩家客户端设置的视距换算为方块。
    default: player-view-distance
    # MineRails 允许的最大展示半径。必须在 (0, 4096] 内。
    max-blocks: 512.0

# 玩家与绑定列车任意车厢中心的最大允许距离（米）。
# 超过该距离后，列车钥匙会自动解绑。
train-key-bind-distance: 20.0

# 是否启用逐 tick 列车调试日志。
# true 时会写入 plugins/MineRails/debug/train_debug.csv。
# 仅在短时间采样排障时开启。
train-debug-log: false

# 每个世界的列车物理 Worker 数量。必须为正整数；不会被静默修正。
physics-worker-threads: 4

# 是否让持续超过轨道几何脱轨时速的列车脱轨。
overspeed-derail-enabled: false
# 用于反算曲线脱轨时速的硬性未平衡横向加速度。
derail-lateral-acceleration-mps2: 3.0
# 超过几何脱轨时速多少 km/h 后开始累计超速 tick。
overspeed-tolerance-kmh: 5.0
# 连续超速多少 tick 后脱轨。
overspeed-grace-ticks: 5

# Timetable WebUI process mode:
# managed: MineRails extracts, starts, and stops an isolated WebUI Java sidecar (default).
# external: an administrator runs WebUI independently; both processes use bearer-token-env.
# disabled: neither WebUI nor its bridge is started.
timetable-webui:
  mode: managed
  bind-address: 127.0.0.1
  port: 8080
  # Clickable URL emitted by /mr timetable edit. Set this to the authenticated
  # reverse-proxy URL when players do not browse on the server host.
  public-url: http://127.0.0.1:8080
  shutdown-timeout-millis: 5000

# Authenticated loopback-only timetable HTTP bridge used by managed or external WebUI.
# In managed mode MineRails generates an ephemeral token; bearer-token-env is used only
# in external mode.
timetable-http-bridge:
  enabled: true
  bind-address: 127.0.0.1
  port: 8765
  bearer-token-env: MINERAILS_TIMETABLE_HTTP_TOKEN
  body-limit-bytes: 1048576
  timeout-millis: 5000
