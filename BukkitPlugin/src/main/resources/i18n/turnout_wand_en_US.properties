item.name=Turnout Wand
help.select=Left-click the approach rail near the turnout; right-click the desired branch to connect it.
help.inspect=Shift + right-click: help/current connection. Shift + left-click air: clear selection.
help.preview=Cyan: approach. Green: connected both ways. Orange: reverse direction not aligned. Particles show only a short local section.
help.authority=Alignment is not movement authority. Trains and route/resource locks may prevent switching.
command.given=Turnout Wand given. Left-click an approach, then right-click a branch.
command.help=/jr wand turnout - get the manual turnout tool
command.player_only=Only players can receive a Turnout Wand.
permission.denied=You need javarailways.admin to use the Turnout Wand.
selection.cleared=Turnout selection cleared.
selection.required=Left-click the approach rail near a turnout first.
selection.selected=Approach selected; right-click a branch.
selection.stale=The world or track topology changed. Left-click the approach again.
target.missing=No rail targeted. Aim at the track near the turnout.
target.not_turnout=The nearer end of this rail is not a turnout. Aim closer to the turnout end.
target.illegal=That endpoint is not a legal branch from this approach.
query.busy=Still locating the track; wait for the result.
query.failed=Could not locate or switch the turnout. See the server log.
result.selected=Turnout switched.
result.unchanged=This connection is already selected.
result.world_unavailable=The railway world is unavailable.
result.stale_topology=The track topology changed. Left-click the approach again.
result.invalid_selection=The endpoints no longer form a legal turnout connection.
result.physically_occupied=Cannot switch: a train occupies the turnout locking area.
result.resource_conflict=Cannot switch: a route claim or infrastructure edit holds the turnout.
connection.none=Current: no active connection from this approach.
connection.aligned=Current: %s → %s (aligned both ways).
connection.one_way=Current: %s → %s (reverse direction not aligned).
connection.port=(%.1f, %.1f, %.1f), rail %s/%s
