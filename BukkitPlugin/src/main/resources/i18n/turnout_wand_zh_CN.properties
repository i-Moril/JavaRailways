item.name=道岔操作 Wand
help.select=左键道岔附近的来向轨道；右键目标支路，尝试连接。
help.inspect=Shift + 右键：说明/当前连接。Shift + 左键空气：清空选择。
help.preview=青色：来向。绿色：双向已对齐。橙色：反向尚未对齐。粒子只显示道岔附近的一小段。
help.authority=道岔连通不等于行车授权；列车占用、进路资源或施工锁定时可能拒绝切换。
command.given=已给予道岔操作 Wand。先左键来向，再右键目标支路。
command.help=/jr wand turnout - 获取手动道岔操作工具
command.player_only=只有玩家可以领取道岔操作 Wand。
permission.denied=使用道岔操作 Wand 需要 javarailways.admin 权限。
selection.cleared=已清空道岔选择。
selection.required=请先左键选择道岔附近的来向轨道。
selection.selected=已选择来向，请右键目标支路。
selection.stale=世界或轨道拓扑已变化，请重新左键选择来向。
target.missing=未瞄准轨道，请对准道岔附近的轨道。
target.not_turnout=所点轨道较近的一端不是道岔，请瞄准靠近道岔的一端。
target.illegal=该端点不是所选来向的合法支路。
query.busy=正在定位轨道，请等待结果。
query.failed=无法定位或切换道岔，请查看服务器日志。
