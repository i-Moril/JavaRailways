result.stale_topology=轨道拓扑已变化，请重新左键选择来向。
result.invalid_selection=两个端点已不构成合法道岔连接。
result.physically_occupied=无法切换：列车占用了道岔锁闭范围。
result.resource_conflict=无法切换：道岔被进路资源或基础设施编辑占用。
connection.none=当前：所选来向没有活动连接。
connection.aligned=当前：%s → %s（双向已对齐）。
