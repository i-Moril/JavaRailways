# JavaRailways 默认轨道可视化配置。
# 除 offset/rotation/scale 的 x/y/z 可省略并使用默认值外，其余键都是必填项；
# 如果删除必填字段或写错类型，插件会在加载时直接报错。
# 局部轴：X 为横向（上方向 × 前方向），Y 向上，Z 沿轨向前；偏移单位为米。
# 将此文件复制到插件数据目录后，可按需修改数值。

# 重复周期长度（米）。每个元素沿曲线每隔此距离放置一次。
repeat_length: 0.95

# 周期内的显示元素列表。每个元素都会在一个 repeat_length 周期内重复一次。
# 每个元素都必须显式提供：type / material / offset / rotation / scale。
# brightness 可选；block/sky 范围均为 0..15，省略 brightness 时使用环境光照。
# light_probe_offset 可选，使用与 offset 相同的曲线局部坐标，并且不改变模型视觉位置。
# offset/rotation/light_probe_offset 缺失的分量默认是 0.0，scale 缺失的分量默认是 1.0。
elements:
  - type: block
    material: RAIL
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    # 将采样实体放到轨面上方的空气中，模型仍保持在 offset 指定的位置。
    light_probe_offset:
      y: 0.5
    rotation:
      x: 0.0
      y: -90.0
      z: 0.0
    # brightness:
    #   block: 15
    #   sky: 15
    scale:
      x: 1.0
      y: 1.0
      z: 1.0
