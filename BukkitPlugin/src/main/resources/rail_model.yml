# 轨道可视化配置文件
# 复制此文件到插件数据文件夹并重命名为 rail_model.yml

# 重复周期长度（米）。每个元素沿曲线每隔此距离放置一次。
repeat_length: 0.95

# 周期内的显示元素列表。每个元素沿曲线每隔 repeat_length 放置一次。
elements:
  - type: block
    material: RAIL
#    item:
#      material: CHEST
#      custom_model_data: null
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    rotation:
      x: 0.0
      y: 0.0
      z: 0.0
    scale:
      x: 1.0
      y: 1.0
      z: 1.0