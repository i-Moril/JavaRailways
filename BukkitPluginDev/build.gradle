plugins {
    id 'java'
    id('org.jetbrains.kotlin.jvm') version '2.3.0'
    id("xyz.jpenilla.resource-factory-bukkit-convention") version "1.3.0"
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'work.art1st'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("org.joml:joml:1.10.8")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation(project(":Core"))
    implementation(project(":Basic"))
    implementation(project(":ConfigLib"))
    implementation(project(":BukkitPlugin"))
}

tasks.compileJava { options.release = 21 }

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

bukkitPluginYaml {
    main = "work.art1st.mineRails.bukkit.BukkitPluginDev"
    apiVersion = "1.21.11"
    name = "MineRailsDev"

    commands.register("phys") {
        description.set("Physics playground: oval track + train test")
    }
}
