plugins {
    id 'java'
    id('org.jetbrains.kotlin.jvm') version '2.3.0'
    id("xyz.jpenilla.resource-factory-bukkit-convention") version "1.3.0"
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'work.art1st'
version = '1.0-SNAPSHOT'

base {
    archivesName = 'JavaRailwaysDev'
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://maven.pvphub.me/tofaa") }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("org.joml:joml:1.10.8")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    compileOnly(project(":Core"))
    compileOnly(project(":Basic"))
    compileOnly(project(":ConfigLib"))
    compileOnly(project(":BukkitPlugin"))
}

tasks.compileJava { options.release = 25 }

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

bukkitPluginYaml {
    main = "work.art1st.javarailways.bukkit.BukkitPluginDev"
    apiVersion = "1.21.11"
    name = "JavaRailwaysDev"
    depend.add("JavaRailways")
}

// The dev plugin depends on JavaRailways and calls APIs whose signatures contain Kotlin types.
// A private stdlib copy creates distinct FunctionN classes and violates those loader constraints,
// so the runtime copy must come from the required host plugin together with its API classes.
shadowJar {
    dependencies {
        exclude(dependency("org.jetbrains.kotlin:.*"))
        exclude(dependency("org.jetbrains.kotlinx:.*"))
        exclude(project(":Core"))
        exclude(project(":Basic"))
        exclude(project(":ConfigLib"))
        exclude(project(":BukkitPlugin"))
    }
}
