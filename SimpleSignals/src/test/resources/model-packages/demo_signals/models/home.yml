parts:
  - import: mast
  - import: head
    offset: {y: 3.2}
default:
  lamp: dark
variants:
  stop: {lamp: red}
  proceed: {lamp: green}
rail-placement:
  follow-rail-tilt: false
  presets:
    left:
      offset: {x: 2.0}
      rotation: {y: 180.0}
    right:
      offset: {x: -2.0}
      rotation: {y: 180.0}
