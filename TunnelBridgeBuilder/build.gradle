plugins {
    id 'java'
    id('org.jetbrains.kotlin.jvm') version '2.3.0'
    id('org.jetbrains.kotlin.plugin.serialization') version '2.3.0'
    id('xyz.jpenilla.resource-factory-bukkit-convention') version '1.3.0'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'work.art1st'
version = '1.0-SNAPSHOT'

base {
    archivesName = 'TunnelBridgeBuilder'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
    // Paper resolves these runtime libraries outside the add-on JAR.
    compileOnly('org.jetbrains.kotlin:kotlin-stdlib-jdk8')
    compileOnly('org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0')

    // JavaRailways owns rail/world APIs at runtime. These projects must never be copied into
    // the add-on jar; plugin.yml makes JavaRailways a required server dependency instead.
    compileOnly(project(':Core'))
    compileOnly(project(':Basic'))
    compileOnly(project(':ConfigLib'))
    compileOnly(project(':BukkitPlugin'))

    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
    testImplementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8')
    testImplementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

bukkitPluginYaml {
    name = 'TunnelBridgeBuilder'
    main = 'work.art1st.javarailways.tunnelbridgebuilder.TunnelBridgeBuilderPlugin'
    apiVersion = '1.21.11'
    foliaSupported = true
    authors.add('__ART1st__')
    depend.add('JavaRailways')
    libraries.add('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.0')
    libraries.add('org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0')

    commands.register('tunnelbridgebuilder') {
        description.set('TunnelBridgeBuilder command')
        aliases.add('tbb')
        permission.set('tunnelbridgebuilder.wand')
    }

    permissions.register('tunnelbridgebuilder.wand') {
        description.set('Allows receiving and using the TunnelBridgeBuilder wand')
        getDefault().set(xyz.jpenilla.resourcefactory.bukkit.Permission.Default.OP)
    }
}

// Produce the deployable add-on jar without embedding JavaRailways or language runtimes.
// Paper resolves declared libraries into its shared library cache.
shadowJar {
    archiveClassifier.set('all')
}

build.dependsOn shadowJar
