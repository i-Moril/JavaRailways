# 车厢和转向架模型配置文件
# 复制此文件到插件数据文件夹并重命名为 car_model.yml

# === 车厢模型 ===
car:
  # 车厢底板
  floor:
    material: OAK_PLANKS
    # 相对车厢中心的局部偏移
    offset:
      x: 0.0
      y: 0.0
      z: 0.0
    # 模型缩放 (x=长度, y=高度, z=宽度)
    scale:
      x: 2.0
      y: 0.12
      z: 0.9

  # 车厢侧壁（可配置多个）
  walls:
    - material: OAK_FENCE
      offset:
        x: 0.0
        y: 0.5
        z: 0.0
      scale:
        x: 2.0
        y: 0.8
        z: 0.1

  # 车厢顶部横梁
  roof:
    material: OAK_SLAB
    offset:
      x: 0.0
      y: 1.0
      z: 0.0
    scale:
      x: 2.0
      y: 0.1
      z: 0.9

# === 转向架模型 ===
bogie:
  # 转向架主体
  frame:
    material: IRON_BLOCK
    offset:
      x: 0.0
      y: -0.1
      z: 0.0
    scale:
      x: 0.8
      y: 0.15
      z: 0.7

# === 座位配置 ===
seat:
  # 座位偏移（相对车厢局部坐标系）
  offset:
    x: -0.5    # 车厢尾部
    y: 0.8     # 距车厢底部高度
    z: 0.0
  # Interaction 实体碰撞箱大小
  interaction:
    width: 0.5
    height: 1.0
