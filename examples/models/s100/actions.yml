config-version: 1
actions:
  door-left-open:
    display-name: "左侧开门"
    executable: false
    requires-control: false
    animations:
      - name: doors_l_light
        at: 0.0
      - name: doors_l
        scene: open
        at: 0.0
    sounds:
      - key: minecraft:block.iron_door.open
        volume: 0.8
        pitch: 1.0
        at: 0.0
  door-left-close:
    display-name: "左侧关门"
    executable: false
    requires-control: false
    animations:
      - name: doors_l_light
        at: 0.0
      - name: doors_l
        scene: closed
        at: 0.6
    sounds:
      - key: minecraft:block.iron_door.close
        volume: 0.8
        pitch: 1.0
        at: 0.6
  door-right-open:
    display-name: "右侧开门"
    executable: false
    requires-control: false
    animations:
      - name: doors_r_light
        at: 0.0
      - name: doors_r
        scene: open
        at: 0.0
    sounds:
      - key: minecraft:block.iron_door.open
        volume: 0.8
        pitch: 1.0
        at: 0.0
  door-right-close:
    display-name: "右侧关门"
    executable: false
    requires-control: false
    animations:
      - name: doors_r_light
        at: 0.0
      - name: doors_r
        scene: closed
        at: 0.6
    sounds:
      - key: minecraft:block.iron_door.close
        volume: 0.8
        pitch: 1.0
        at: 0.6
  front-light-head:
    executable: false
    requires-control: false
    animations:
      - name: front_end_light
        scene: "head"
        at: 0.0
  front-light-tail:
    executable: false
    requires-control: false
    animations:
      - name: front_end_light
        scene: "tail"
        at: 0.0
  front-light-off:
    executable: false
    requires-control: false
    animations:
      - name: front_end_light
        scene: "off"
        at: 0.0
  rear-light-head:
    executable: false
    requires-control: false
    animations:
      - name: rear_end_light
        scene: "head"
        at: 0.0
  rear-light-tail:
    executable: false
    requires-control: false
    animations:
      - name: rear_end_light
        scene: "tail"
        at: 0.0
  rear-light-off:
    executable: false
    requires-control: false
    animations:
      - name: rear_end_light
        scene: "off"
        at: 0.0
  cabin-lights-on:
    display-name: "开启车内灯"
    executable: false
    requires-control: false
    animations:
      - name: cabin_lights
        scene: "on"
        at: 0.0
  cabin-lights-off:
    display-name: "关闭车内灯"
    executable: false
    requires-control: false
    animations:
      - name: cabin_lights
        scene: "off"
        at: 0.0
