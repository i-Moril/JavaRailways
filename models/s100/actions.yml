actions:
  door-left-open:
    display-name: "左侧开门"
    executable: true
    requires-control: false
    animations:
      - name: doors_l_light
        at: 0.0
      - name: doors_l
        scene: open
        at: 0.0
    sounds:
      - key: minecraft:block.iron_door.open
        volume: 0.8
        pitch: 1.0
        at: 0.0
  door-left-close:
    display-name: "左侧关门"
    executable: true
    requires-control: false
    animations:
      - name: doors_l_light
        at: 0.0
      - name: doors_l
        scene: closed
        at: 0.6
    sounds:
      - key: minecraft:block.iron_door.close
        volume: 0.8
        pitch: 1.0
        at: 0.6
  door-right-open:
    display-name: "右侧开门"
    executable: true
    requires-control: false
    animations:
      - name: doors_r_light
        at: 0.0
      - name: doors_r
        scene: open
        at: 0.0
    sounds:
      - key: minecraft:block.iron_door.open
        volume: 0.8
        pitch: 1.0
        at: 0.0
  door-right-close:
    display-name: "右侧关门"
    executable: true
    requires-control: false
    animations:
      - name: doors_r_light
        at: 0.0
      - name: doors_r
        scene: closed
        at: 0.6
    sounds:
      - key: minecraft:block.iron_door.close
        volume: 0.8
        pitch: 1.0
        at: 0.6
