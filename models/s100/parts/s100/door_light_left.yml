config-version: 1
name: door_light_left
type: item_display
item:
  type: IRON_NUGGET
  item-model: "art1st/tc/s100/left_door_light"
animations:
  - name: doors_l_light
    keep-final-state: true
    keyframes:
      - at: 0.0
        item-type: IRON_NUGGET
        item-model: "art1st/tc/s100/left_door_light_warning"
      - at: 0.6
        item-type: IRON_NUGGET
        item-model: "art1st/tc/s100/left_door_light"
      - at: 1.0
        item-type: IRON_NUGGET
        item-model: "art1st/tc/s100/left_door_light_warning"
      - at: 1.3
        item-type: IRON_NUGGET
        item-model: "art1st/tc/s100/left_door_light"
