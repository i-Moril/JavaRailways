# 轨道可视化配置文件
# 局部轴：X 横向（上方向 × 前方向），Y 向上，Z 沿轨向前。
# 复制此文件到插件数据文件夹并重命名为 rail_model.yml

# 重复周期长度（米）。每个元素沿曲线每隔此距离放置一次。
repeat_length: 2.0

# 周期内的显示元素列表。每个元素沿曲线每隔 repeat_length 放置一次。
elements:
  # 枕木（垂直于轨道的木板，铺在铁轨下方）
  - type: block
    material: OAK_PLANKS
    offset:
      x: 0.0
      y: -0.18
      z: 0.0
    rotation: {y: -90.0}
    scale:
      x: 1.6
      y: 0.08
      z: 1.4
  # 左轨道
  - type: block
    material: RAIL
    offset:
      x: -0.3
      y: -0.1
      z: 0.0
    rotation: {y: -90.0}
    scale:
      x: 1.0
      y: 0.05
      z: 0.1
  # 右轨道
  - type: block
    material: RAIL
    offset:
      x: 0.3
      y: -0.1
      z: 0.0
    rotation: {y: -90.0}
    scale:
      x: 1.0
      y: 0.05
      z: 0.1
