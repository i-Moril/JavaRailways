pluginManagement {
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.3.0'
        id 'org.jetbrains.dokka' version '2.2.0'
        id 'org.jetbrains.dokka-javadoc' version '2.2.0'
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'MineRails'

include 'Core'
include 'Basic'
include 'Annotation'
include 'BukkitPlugin'
include 'BukkitPluginDev'
include 'ConfigLib'
include 'WebUI'
include 'ScriptWorker'