# <namespace>/parts/[sub-namespaces/]<part-name>.yml
config-version: 1
name: [sub-namespaces/]<part-name>
type: <item_display | interact | dummy | seat | ...>
item:  # For item display:
  type: <item_material>
  custom-model-data: <int>
  scale:  # Optional
    x: <float>
    y: <float>
    z: <float>
  animations:  # Optional
    - name: <animation-name>
      commands:
        - <list of animation commands>
offset:  # Optional
  x: <float>
  y: <float>
  z: <float>
rotation:  # Optional
  x: <float>
  y: <float>
  z: <float>
parts:  # Standard part list format
  - import: [namespace, blank for same namespace/][sub-namespaces/]<part-name>    # Import format
    offset: # Optional
      x: <float>
      y: <float>
      z: <float>
    rotation:  # Optional
      x: <float>
      y: <float>
      z: <float>
  - name: [namespace, blank for same namespace/][sub-namespaces/]<part-name>     # Inline format
    type: ...
    offset:  # Optional
      x: <float>
      y: <float>
      z: <float>
    rotation:  # Optional
      x: <float>
      y: <float>
      z: <float>
    # other type-specific settings
  - ...

# <namespace>/cars/[sub-namespaces/]<car-type>.yml
config-version: 1
name: [sub-namespaces/]<car-name>
length: <float>
body-parts:
  <Standard part list>
bogies:
  - offset:
      x: <float>
      y: <float>
      z: <float>
    parts:  # head bogie
      <Standard part list>
    wheel-parts:
      <Standard part list>
    wheel-diameter: <int>
  - offset:
      x: <float>
      y: <float>
      z: <float>
    parts: # tail bogie
      <Standard part list>
    wheel-parts:
      <Standard part list>
    wheel-diameter: <int>

# <namespace>/trains/[sub-namespaces/]<train-type>.yml
config-version: 1
name: [sub-namespaces/]<train-name>
composition:
  - [namespace/][sub-namespaces/]<car-name>
  - ...
properties:   # May consider in the future. Including max-speed, acceleration, etc.